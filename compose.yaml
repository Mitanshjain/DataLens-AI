services:

  backend:
    image: datalens-backend:latest
    container_name: datalens-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    image: datalens-frontend:latest
    container_name: datalens-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped